<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEAP University — AW 101</title>
<style>
  :root{
    --maroon:#8B1E2D;
    --maroon-dk:#6E1724;
    --gold:#C5A059;
    --amber:#B5750C;
    --ink:#1A1A1A;
    --slate:#475569;
    --cream:#F7F2EC;
    --cream2:#EDE4D8;
    --white:#FFFFFF;
    --green:#2F6F4E;
    --red:#B3261E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family: Georgia, 'Times New Roman', serif;
    background: var(--cream);
    color: var(--ink);
    min-height:100vh;
  }
  .sans{ font-family: -apple-system, Segoe UI, Calibri, Helvetica, Arial, sans-serif; }
  #app{ max-width:880px; margin:0 auto; padding:0 20px 60px; }

  /* Header */
  .course-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:22px 0 16px; border-bottom:2px solid var(--maroon);
    margin-bottom:0;
  }
  .brand{ display:flex; align-items:center; gap:12px; }
  .crest{
    width:40px; height:40px; border-radius:50%; flex:none; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
  }
  .crest img{ width:100%; height:100%; object-fit:contain; }
  .brand-text .eyebrow{ font-family: Georgia, serif; font-size:11px; letter-spacing:1.5px; color:var(--maroon); font-weight:bold; }
  .brand-text .course-code{ font-size:13px; color:var(--slate); font-family: -apple-system,Segoe UI,Calibri,sans-serif;}
  .duration-pill{
    font-family: -apple-system,Segoe UI,Calibri,sans-serif; font-size:12.5px; color:var(--maroon-dk);
    background:var(--cream2); border-radius:20px; padding:6px 14px; white-space:nowrap;
  }

  /* Progress bar */
  .progress-track{ height:6px; background:var(--cream2); border-radius:4px; margin:18px 0 30px; overflow:hidden; }
  .progress-fill{ height:100%; background:var(--maroon); border-radius:4px; transition:width .35s ease; }
  .progress-label{ font-family:-apple-system,Segoe UI,Calibri,sans-serif; font-size:12px; color:var(--slate); margin-top:6px; text-align:right;}

  /* Card */
  .card{
    background:var(--white); border:1px solid var(--cream2); border-radius:6px;
    padding:44px 48px; min-height:420px; display:flex; flex-direction:column;
    box-shadow: 0 2px 14px rgba(0,0,0,0.04);
  }
  @media (max-width:640px){ .card{ padding:28px 22px; } }

  .kicker{ font-family: -apple-system,Segoe UI,Calibri,sans-serif; font-size:12.5px; letter-spacing:1px; color:var(--maroon); font-weight:700; margin-bottom:10px;}
  h1.slide-title{ font-size:28px; margin:0 0 18px; line-height:1.25; }
  h2.slide-title{ font-size:23px; margin:0 0 16px; line-height:1.3; }
  .body-text{ font-family:-apple-system,Segoe UI,Calibri,sans-serif; font-size:16px; line-height:1.65; color:var(--slate); }
  .body-text p{ margin:0 0 14px; }

  ul.obj-list{ list-style:none; margin:0; padding:0; font-family:-apple-system,Segoe UI,Calibri,sans-serif;}
  ul.obj-list li{ position:relative; padding-left:28px; margin-bottom:12px; font-size:15.5px; color:var(--ink); line-height:1.5;}
  ul.obj-list li:before{ content:"\2713"; position:absolute; left:0; top:1px; color:var(--maroon); font-weight:bold;}

  .points{ list-style:none; margin:0; padding:0; font-family:-apple-system,Segoe UI,Calibri,sans-serif;}
  .points li{ position:relative; padding-left:22px; margin-bottom:14px; font-size:15.5px; color:var(--ink); line-height:1.55;}
  .points li:before{ content:""; position:absolute; left:0; top:8px; width:7px; height:7px; background:var(--gold); border-radius:50%;}

  .callout{ background:var(--cream); border-left:3px solid var(--gold); padding:14px 18px; margin:18px 0; font-family:-apple-system,Segoe UI,Calibri,sans-serif; font-size:14.5px; color:var(--maroon-dk); border-radius:0 4px 4px 0;}

  .module-tag{ display:inline-block; font-family:-apple-system,Segoe UI,Calibri,sans-serif; font-size:11.5px; font-weight:700; letter-spacing:0.5px; color:var(--white); background:var(--maroon); padding:4px 10px; border-radius:3px; margin-bottom:14px;}

  /* Knowledge check / assessment */
  .kc-badge{ display:inline-flex; align-items:center; gap:8px; font-family:-apple-system,Segoe UI,Calibri,sans-serif; font-size:11.5px; font-weight:700; letter-spacing:0.5px; color:var(--maroon-dk); background:var(--cream2); padding:5px 12px; border-radius:3px; margin-bottom:16px;}
  .kc-question{ font-family:-apple-system,Segoe UI,Calibri,sans-serif; font-size:17px; font-weight:600; color:var(--ink); margin-bottom:20px; line-height:1.5;}
  .options{ display:flex; flex-direction:column; gap:10px; margin-bottom:20px;}
  .option{
    font-family:-apple-system,Segoe UI,Calibri,sans-serif; font-size:15px; text-align:left;
    padding:13px 16px; border:1.5px solid var(--cream2); border-radius:6px; background:var(--white);
    cursor:pointer; transition: border-color .15s, background .15s; color:var(--ink);
    display:flex; align-items:center; gap:12px;
  }
  .option:hover{ border-color:var(--gold); background:var(--cream); }
  .option .letter{ width:22px; height:22px; border-radius:50%; border:1.5px solid var(--slate); display:flex; align-items:center; justify-content:center; font-size:12px; flex:none; color:var(--slate); }
  .option.selected{ border-color:var(--maroon); background:var(--cream); }
  .option.selected .letter{ border-color:var(--maroon); background:var(--maroon); color:var(--white); }
  .option.correct{ border-color:var(--green); background:#EAF4EE; }
  .option.correct .letter{ background:var(--green); border-color:var(--green); color:var(--white); }
  .option.incorrect{ border-color:var(--red); background:#FBEAE9; }
  .option.incorrect .letter{ background:var(--red); border-color:var(--red); color:var(--white); }
  .option:disabled, .option.locked{ cursor:default; }

  .feedback{ font-family:-apple-system,Segoe UI,Calibri,sans-serif; font-size:14.5px; padding:14px 16px; border-radius:6px; margin-bottom:8px; line-height:1.55; display:none;}
  .feedback.show{ display:block; }
  .feedback.correct-fb{ background:#EAF4EE; color:#20573B; border:1px solid #BEE0CC; }
  .feedback.incorrect-fb{ background:#FBEAE9; color:#8A2A24; border:1px solid #F0C4C1; }
  .feedback b{ display:block; margin-bottom:3px; }

  /* Footer nav */
  .card-footer{ margin-top:auto; padding-top:28px; display:flex; align-items:center; justify-content:space-between; }
  .btn{
    font-family:-apple-system,Segoe UI,Calibri,sans-serif; font-size:14.5px; font-weight:600;
    padding:12px 26px; border-radius:5px; border:none; cursor:pointer; transition: opacity .15s, transform .1s;
  }
  .btn:active{ transform: translateY(1px); }
  .btn-primary{ background:var(--maroon); color:var(--white); }
  .btn-primary:hover{ background:var(--maroon-dk); }
  .btn-primary:disabled{ background:#C9BCB0; cursor:not-allowed; }
  .btn-ghost{ background:transparent; color:var(--slate); padding:12px 8px; }
  .btn-ghost:hover{ color:var(--ink); }
  .btn-ghost:disabled{ visibility:hidden; }

  /* Landing / result / summary */
  .landing-icon, .complete-icon{ width:64px; height:64px; border-radius:50%; border:2px solid var(--maroon); display:flex; align-items:center; justify-content:center; font-size:26px; color:var(--maroon); margin-bottom:22px;}
  .complete-icon{ border-color:var(--green); color:var(--green); }
  .meta-row{ display:flex; gap:26px; flex-wrap:wrap; margin:22px 0 6px; font-family:-apple-system,Segoe UI,Calibri,sans-serif;}
  .meta-item .meta-label{ font-size:11px; letter-spacing:0.5px; color:var(--slate); font-weight:700; margin-bottom:3px;}
  .meta-item .meta-value{ font-size:14.5px; color:var(--ink); }

  .score-box{ display:flex; gap:36px; margin:22px 0; flex-wrap:wrap; }
  .score-num{ font-family:Georgia,serif; font-size:40px; color:var(--maroon); font-weight:bold; }
  .score-label{ font-family:-apple-system,Segoe UI,Calibri,sans-serif; font-size:13px; color:var(--slate); }

  /* Feedback survey */
  .survey-meta{ width:100%; border-collapse:collapse; margin:20px 0 30px; font-family:-apple-system,Segoe UI,Calibri,sans-serif; font-size:14px; }
  .survey-meta td{ border:1px solid var(--cream2); padding:10px 14px; }
  .survey-meta td.label{ background:var(--cream); font-weight:700; width:36%; color:var(--ink); }
  .survey-meta td.value{ color:var(--slate); }
  .survey-q{ margin-bottom: 26px; }
  .survey-q-text{ font-family:-apple-system,Segoe UI,Calibri,sans-serif; font-size:15.5px; font-weight:700; color:var(--ink); margin-bottom:10px; }
  .survey-scale{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-family:-apple-system,Segoe UI,Calibri,sans-serif; font-size:13px; color:var(--slate); }
  .survey-scale .end-label{ font-style:italic; min-width:96px; }
  .survey-scale .end-label.right{ text-align:left; }
  .survey-dot{
    width:34px; height:34px; border-radius:50%; border:1.5px solid var(--cream2); background:var(--white);
    display:flex; align-items:center; justify-content:center; font-size:14px; color:var(--slate); cursor:pointer;
    font-family:-apple-system,Segoe UI,Calibri,sans-serif; transition: all .15s;
  }
  .survey-dot:hover{ border-color:var(--gold); }
  .survey-dot.selected{ background:var(--maroon); border-color:var(--maroon); color:var(--white); font-weight:700; }
  .survey-textarea{
    width:100%; min-height:90px; border:1.5px solid var(--cream2); border-radius:6px; padding:12px 14px;
    font-family:-apple-system,Segoe UI,Calibri,sans-serif; font-size:14.5px; color:var(--ink); resize:vertical;
  }
  .survey-textarea:focus{ outline:none; border-color:var(--gold); }

  .assess-note{ font-family:-apple-system,Segoe UI,Calibri,sans-serif; font-size:14px; color:var(--slate); background:var(--cream); border-radius:6px; padding:12px 16px; margin:4px 0 20px;}

  /* Illustrations (inline SVG, no external requests) */
  .hero-fig{ margin:-44px -48px 22px; background:linear-gradient(135deg,#F5EAE3,#EDE0D2); display:flex; align-items:center; justify-content:center; }
  .hero-fig svg{ width:100%; height:230px; display:block; }
  @media (max-width:640px){ .hero-fig{ margin:-28px -22px 18px; } .hero-fig svg{ height:170px; } }
  .module-fig{ margin:6px 0 20px; border-radius:8px; overflow:hidden; background:#F7F2EC; display:flex; align-items:center; justify-content:center; }
  .photo-fig{ flex-direction:column; padding:14px; }
  .photo-caption{ font-size:12px; color:var(--slate); text-align:center; margin-top:8px; font-style:italic; }
  .kc-photo{ width:100%; max-width:320px; display:block; margin:0 auto 18px; border-radius:8px; }

  /* Gamification */
  .xp-pop{
    margin-top:10px; font-family:-apple-system,Segoe UI,Calibri,sans-serif; font-size:14px; font-weight:800;
    color:var(--amber); animation: xpFloat .5s ease-out;
  }
  @keyframes xpFloat{
    0%{ opacity:0; transform:translateY(6px); }
    100%{ opacity:1; transform:translateY(0); }
  }
  .level-up-banner{
    background:linear-gradient(90deg,#FBEFD9,#F7DFC0); border:1.5px solid var(--gold); border-radius:8px;
    padding:12px 16px; margin-bottom:10px; font-family:-apple-system,Segoe UI,Calibri,sans-serif; font-size:14.5px;
    color:var(--maroon-dk); animation: levelPop .4s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes levelPop{
    0%{ opacity:0; transform:scale(.9); }
    100%{ opacity:1; transform:scale(1); }
  }
  .module-fig svg{ width:100%; height:190px; display:block; }
</style>
</head>
<body>
<div id="app"></div>

<script>
const COURSE = {"heroSvg": "<svg viewBox=\"0 0 600 300\" xmlns=\"http://www.w3.org/2000/svg\"><g transform=\"translate(300,150)\">\n    <circle cx=\"-180\" cy=\"-70\" r=\"70\" fill=\"#C5A059\" opacity=\"0.12\"/>\n    <circle cx=\"200\" cy=\"60\" r=\"90\" fill=\"#8B1E2D\" opacity=\"0.08\"/>\n    <circle cx=\"150\" cy=\"-90\" r=\"34\" fill=\"#C5A059\" opacity=\"0.18\"/>\n    \n<circle cx=\"140\" cy=\"-100\" r=\"36\" fill=\"#C5A059\" opacity=\"0.5\"/>\n<ellipse cx=\"0\" cy=\"100\" rx=\"160\" ry=\"16\" fill=\"#475569\" opacity=\"0.15\"/>\n<ellipse cx=\"10\" cy=\"20\" rx=\"75\" ry=\"65\" fill=\"#F7F2EC\" stroke=\"#475569\" stroke-width=\"4\"/>\n<ellipse cx=\"-55\" cy=\"-15\" rx=\"34\" ry=\"34\" fill=\"#F7F2EC\" stroke=\"#475569\" stroke-width=\"4\"/>\n<path d=\"M -70 -30 q -6 -18 8 -22 q 4 10 2 20 Z\" fill=\"#8B1E2D\"/>\n<path d=\"M -58 -34 q -2 -20 12 -22 q 6 12 0 22 Z\" fill=\"#8B1E2D\"/>\n<path d=\"M -46 -32 q 2 -18 14 -18 q 4 10 -2 20 Z\" fill=\"#8B1E2D\"/>\n<polygon points=\"-88,-14 -108,-8 -88,-2\" fill=\"#B5750C\"/>\n<circle cx=\"-62\" cy=\"-18\" r=\"4.5\" fill=\"#1A1A1A\"/>\n<path d=\"M -50 8 q 10 12 0 22\" fill=\"none\" stroke=\"#B5750C\" stroke-width=\"3\"/>\n<path d=\"M 40 30 q 45 -5 55 20 q -30 15 -55 -5 Z\" fill=\"#8291A3\" opacity=\"0.7\"/>\n<line x1=\"-15\" y1=\"82\" x2=\"-15\" y2=\"105\" stroke=\"#B5750C\" stroke-width=\"6\" stroke-linecap=\"round\"/>\n<line x1=\"25\" y1=\"82\" x2=\"25\" y2=\"105\" stroke=\"#B5750C\" stroke-width=\"6\" stroke-linecap=\"round\"/>\n<path d=\"M -22 105 l -10 6 M -15 105 l 0 8 M -8 105 l 10 6\" stroke=\"#B5750C\" stroke-width=\"4\" fill=\"none\" stroke-linecap=\"round\"/>\n<path d=\"M 18 105 l -10 6 M 25 105 l 0 8 M 32 105 l 10 6\" stroke=\"#B5750C\" stroke-width=\"4\" fill=\"none\" stroke-linecap=\"round\"/>\n</g></svg>", "courseCode": "AW 101", "courseTitle": "Humane Handling Foundations", "college": "COLLEGE OF ANIMAL WELFARE (SLAUGHTER PLANTS ONLY)", "employeeType": "All (slaughter plants only)", "format": "Virtual, self-contained interactive module", "prerequisites": "None", "estDuration": "5\u20136 min", "leadsTo": "AW 102 \u2014 Applied & Observed Humane Handling", "description": "AW 101 introduces all employees at slaughter plants to humane handling foundations, based on the National Chicken Council (NCC) Animal Welfare Guidelines and Audit Checklist.", "objectives": ["Explain the plant's commitment to humane handling.", "Identify correct handling technique during live-bird receiving and unloading.", "Recognize signs of a welfare concern."], "modules": [{"title": "Corporate Commitment & Personnel Training", "points": ["Humane handling matters at both the plant level and the industry level \u2014 this module explains why.", "Every employee involved in live-bird handling has personnel training and competency requirements to meet.", "This training exists because humane handling is treated as a core operating standard, not an optional add-on \u2014 it's audited the same way food safety and quality are.", "A trained, designated employee is responsible for monitoring day-to-day compliance and conducting the plant's animal welfare audits \u2014 the specific title for this role varies by plant, so don't assume it's always called an \"Animal Welfare Officer.\"", "Employees who work directly with live birds are evaluated through direct, hands-on observation of their technique by a trainer or supervisor \u2014 not just told the rules once and left on their own."], "kcs": [{"question": "AW 101 training standards are based on guidelines from which organization?", "options": ["National Chicken Council", "OSHA, the federal agency focused on general workplace safety", "The FDA, which regulates food and drug products rather than live-bird handling", "USDA APHIS, the agency focused on animal and plant health inspection"], "correctIndex": 0, "explanation": " AW 101 is based on the National Chicken Council (NCC) Animal Welfare Guidelines and Audit Checklist.", "type": "single"}, {"question": "Who has personnel training and competency requirements for live-bird handling?", "options": ["Everyone handling live birds", "Only supervisors", "Only new hires in week one", "Only the welfare committee"], "correctIndex": 0, "explanation": " Training and competency requirements apply to everyone involved in live-bird handling, not just supervisors or new hires.", "type": "single"}]}, {"title": "Live-Bird Handling Basics", "svg": "<svg viewBox=\"0 0 400 220\" xmlns=\"http://www.w3.org/2000/svg\"><g transform=\"translate(200,110)\"><circle cx=\"0\" cy=\"0\" r=\"88\" fill=\"#EDE4D8\" opacity=\"0.6\"/>\n<path d=\"M -100 20 C -110 -10 -95 -40 -60 -35 C -40 -32 -30 -15 -35 5 L -95 35 Z\" fill=\"#C5A059\"/>\n<g transform=\"scale(-1,1)\">\n<path d=\"M -100 20 C -110 -10 -95 -40 -60 -35 C -40 -32 -30 -15 -35 5 L -95 35 Z\" fill=\"#B5750C\"/>\n</g>\n<ellipse cx=\"0\" cy=\"0\" rx=\"34\" ry=\"30\" fill=\"#F7F2EC\" stroke=\"#8B1E2D\" stroke-width=\"3\"/>\n<circle cx=\"-22\" cy=\"-14\" r=\"16\" fill=\"#F7F2EC\" stroke=\"#8B1E2D\" stroke-width=\"3\"/>\n<polygon points=\"-38,-14 -50,-10 -38,-6\" fill=\"#B5750C\"/>\n<circle cx=\"-26\" cy=\"-16\" r=\"2.6\" fill=\"#1A1A1A\"/>\n<path d=\"M -50 -22 q -3 -8 4 -10 q 2 5 1 10 Z\" fill=\"#8B1E2D\"/>\n</g></svg>", "points": ["Correct handling technique applies during catching, transportation, and unloading.", "Recognizing the signs of a welfare concern is the first step toward addressing it.", "Small details \u2014 how a bird is picked up, how a bird is shackled on the line \u2014 add up to the overall welfare outcome auditors are trained to look for.", "Minimizing the time birds spend in transport, and handling crates gently during loading and unloading, are both core parts of humane handling technique.", "DOA (Dead on Arrival) is the standard industry term \u2014 used by USDA-FSIS itself \u2014 for birds found dead at unloading. Plants track DOA rates over time, since a rising rate is often an early signal of a handling, transport, or weather-related welfare issue worth investigating."], "kcs": [{"question": "If you notice a sign of a welfare concern during live-bird handling, you should...", "options": ["Recognize it, notify your supervisor, and follow the plant's escalation process", "Ignore it and continue working, since it will likely resolve on its own", "Handle it yourself quietly, without notifying a supervisor or documenting it", "Wait until the next shift starts before mentioning it to anyone"], "correctIndex": 0, "explanation": " Recognizing a welfare concern is only the first step \u2014 it needs to be escalated through the plant's process so it can be addressed properly.", "type": "single"}, {"question": "What does DOA stand for, and why does the plant track it?", "options": ["Dead on Arrival \u2014 tracking it over time can flag a handling, transport, or weather issue", "Days of Absence, a metric HR uses to track employee attendance patterns", "Delivery Order Audit, a term used in shipping and receiving paperwork", "Damage on Arrival, a packaging-quality metric unrelated to live birds"], "correctIndex": 0, "explanation": " DOA (Dead on Arrival) is the standard term for birds found dead at unloading. A rising DOA rate is a useful early signal that something in handling, transport, or weather needs attention.", "type": "single"}, {"question": "What do auditors look for when assessing humane handling?", "options": ["Small details \u2014 like how a bird is picked up or how a bird is shackled on the line", "Only the total number of birds processed that day, regardless of how", "Only whether the required paperwork was filed on time that shift", "Only how fast the line is moving, without regard to handling technique"], "correctIndex": 0, "explanation": " Auditors are trained to notice the small, specific details of handling technique \u2014 how a bird is picked up, how a bird is shackled on the line \u2014 since those details add up to the overall welfare outcome.", "type": "single"}]}, {"title": "Key Welfare Indicators: Wings, Legs & Stunning", "points": ["Both NCC and IPWA build their programs around Key Welfare Indicators (KWIs) \u2014 specific, measurable signs of how birds are actually doing, not just whether paperwork says the right things happened.", "Wing injuries, out of 500 birds observed, score on a scale: 15 or fewer earns full points, 16\u201320 earns half credit, and more than 20 earns zero for that section.", "Leg injuries use the same 500-bird sample, with a tighter scale: 2 or fewer earns full points, exactly 3 earns half credit, and more than 3 earns zero.", "Stunning effectiveness works the same way: 5 or fewer un-stunned birds (out of 500 observed) earns full points, 6\u201310 earns half credit, and more than 10 earns zero for that section."], "svg": "<svg viewBox=\"0 0 400 220\" xmlns=\"http://www.w3.org/2000/svg\"><g transform=\"translate(200,110)\"><circle cx=\"0\" cy=\"0\" r=\"88\" fill=\"#EDE4D8\" opacity=\"0.6\"/>\n<circle cx=\"-60\" cy=\"-10\" r=\"50\" fill=\"#FFFFFF\" stroke=\"#8B1E2D\" stroke-width=\"3\"/>\n<path d=\"M -80 5 Q -60 -35 -30 -15 Q -50 0 -80 5 Z\" fill=\"#C5A059\"/>\n<text x=\"-60\" y=\"55\" text-anchor=\"middle\" font-family=\"-apple-system,Segoe UI,Calibri,sans-serif\" font-size=\"11\" fill=\"#475569\" font-weight=\"700\">WINGS</text>\n<text x=\"-60\" y=\"-22\" text-anchor=\"middle\" font-family=\"-apple-system,Segoe UI,Calibri,sans-serif\" font-size=\"12.5\" fill=\"#8B1E2D\" font-weight=\"700\">\u226415</text>\n\n<circle cx=\"60\" cy=\"-10\" r=\"50\" fill=\"#FFFFFF\" stroke=\"#475569\" stroke-width=\"3\"/>\n<line x1=\"60\" y1=\"-20\" x2=\"60\" y2=\"15\" stroke=\"#B5750C\" stroke-width=\"6\" stroke-linecap=\"round\"/>\n<line x1=\"60\" y1=\"15\" x2=\"48\" y2=\"28\" stroke=\"#B5750C\" stroke-width=\"6\" stroke-linecap=\"round\"/>\n<text x=\"60\" y=\"55\" text-anchor=\"middle\" font-family=\"-apple-system,Segoe UI,Calibri,sans-serif\" font-size=\"11\" fill=\"#475569\" font-weight=\"700\">LEGS</text>\n<text x=\"60\" y=\"-30\" text-anchor=\"middle\" font-family=\"-apple-system,Segoe UI,Calibri,sans-serif\" font-size=\"12.5\" fill=\"#475569\" font-weight=\"700\">\u22642</text>\n</g></svg>", "kcs": [{"type": "single", "question": "You observe 500 birds and count 18 wing injuries. Where does that land?", "options": ["Half credit \u2014 it's in the 16\u201320 range", "Full points \u2014 15 or fewer is the only thing that matters", "Zero \u2014 any injury at all fails the section", "This doesn't affect the score at all"], "correctIndex": 0, "explanation": " 18 falls in the 16\u201320 range, which earns half credit \u2014 better than failing, but not a full pass. Only 15 or fewer earns full points."}, {"type": "single", "question": "During a 500-bird check, you count 4 leg injuries. What does that score?", "options": ["Zero \u2014 more than 3 leg injuries earns zero for that section", "Full points, since 4 is close to the target", "Half credit, using the same 16\u201320 range that applies to wing injuries", "Leg injuries aren't actually scored under this kind of point system at all"], "correctIndex": 0, "explanation": " Leg injuries have a tighter scale than wing injuries: more than 3 earns zero. At 4, this section scores zero, not half credit."}, {"type": "multi", "question": "\ud83d\udd0d Animal Welfare Officer Check: For wing injuries per 500 birds, which of these pairings are correct? Select all that apply.", "options": ["15 or fewer \u2192 full points", "16\u201320 \u2192 half credit", "More than 20 \u2192 zero", "Any number \u2192 always full points"], "correctIndices": [0, 1, 2], "explanation": " The real 3-tier scale is: 15 or fewer earns full points, 16\u201320 earns half credit, and more than 20 earns zero. There's no version where any number earns full points \u2014 the scale matters."}, {"type": "single", "question": "You observe 500 birds after the stunner and count 8 un-stunned birds. Where does that land?", "options": ["Half credit \u2014 it's in the 6\u201310 range", "Full points, since 8 is a small number out of 500", "Zero, since any un-stunned bird fails the section", "This isn't something auditors actually count"], "correctIndex": 0, "explanation": " 8 falls in the 6\u201310 range, which earns half credit. Only 5 or fewer earns full points, and more than 10 earns zero."}]}, {"title": "Footpad Health & Mechanical Systems", "points": ["Footpad health is checked at the processing plant on a random sample of 200 paws \u2014 each scored pass or fail, and at least 90% (180 of 200) need to pass for that site to earn points.", "This is exactly the kind of hands-on check an Animal Welfare Officer verifies during a plant audit \u2014 not just paperwork, but a physical inspection of real paws.", "Equipment can fail mid-shift \u2014 a stunner or automatic knife malfunctioning is what \u201cmechanical breakdown\u201d refers to. Every plant is required to have a written emergency response plan for exactly this kind of event, so birds aren't left in a bad situation while it's fixed.", "If equipment fails, following that written plan isn't optional \u2014 it's the difference between a well-handled malfunction and a welfare incident on top of a mechanical one."], "kcs": [{"type": "single", "question": "A footpad sample of 200 paws comes back with 165 passing. Does this meet the 90% threshold?", "options": ["No \u2014 165 out of 200 is 82.5%, below the 90% threshold", "Yes \u2014 165 is close enough to 180", "Yes \u2014 any number over 150 passes", "The 90% threshold only applies to larger sample sizes than 200"], "correctIndex": 0, "explanation": " 165 \u00f7 200 = 82.5%. The threshold is 90% (180 of 200), so this sample falls short \u2014 that site doesn't earn points for footpad health this round."}, {"type": "single", "question": "If stunning equipment fails to work properly mid-shift, what should happen?", "options": ["Staff follow the plant's written emergency response plan for the malfunction", "Birds continue through the process normally, since it's treated as a minor issue", "Only maintenance is notified, and no further action is taken beyond that", "The line keeps running as usual until the scheduled end of the shift"], "correctIndex": 0, "explanation": " Every plant is required to have a written emergency response plan for exactly this situation \u2014 following it is what keeps a mechanical failure from becoming a welfare incident too."}]}, {"title": "Plant Audit Essentials", "points": ["Shackling is checked directly on the line: 3 to 4 birds observed not shackled correctly costs points, but more than 4 is an automatic major non-conformance \u2014 a failed section on the spot.", "After the picker, auditors confirm no live birds entered the scalder. A bird with an intact head, uncut carotid arteries, and still red in color after the picker means it wasn't dead before the scalder \u2014 also a major non-conformance.", "A backup knife operator must be present after the automatic knife, ready to induce bleed-out on any bird the equipment didn't effectively cut. Auditors observe 500 birds per line to confirm this backup system is actually working.", "Beyond the physical checks, plants must have a documented, written monitoring program for wing and leg injuries \u2014 including what corrective action to take if the standard gets exceeded. An undocumented program is itself a finding, even if the birds looked fine that day.", "Un-cut birds after the automatic knife follow the same 3-tier scale as stunning: 5 or fewer (out of 500 observed) earns full points, 6\u201310 earns half credit, and more than 10 earns zero \u2014 which is exactly why the backup knife operator matters so much."], "photo": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCAFVA4QDASIAAhEBAxEB/8QAHQABAAIDAQEBAQAAAAAAAAAAAAYHBAUIAwECCf/EAFoQAAEDAwE 4 more than 4 automatically fails that section", "A minor point deduction, treated the same as if it were 3 or 4 birds", "No real issue, since 5 birds is still considered within a normal, expected range", "This would only become a problem if the same count showed up on a second observation"], "correctIndex": 0, "explanation": " More than 4 improperly shackled birds is the line \u2014 at 5, this is an automatic major non-conformance, not just a point deduction like the 3-4 range."}, {"type": "single", "question": "What does it mean if a bird after the picker has an intact head, uncut carotid arteries, and is still red in color?", "options": ["It wasn't dead before entering the scalder \u2014 a major non-conformance", "It passed that part of the audit, since visible condition looked normal", "It's a normal, expected finding that doesn't require any follow-up", "It actually indicates a footpad health issue rather than a stunning issue"], "correctIndex": 0, "explanation": " That combination of signs means the bird wasn't dead before the scalder \u2014 a serious finding that's an automatic major non-conformance."}, {"type": "single", "question": "What is the backup knife operator's job?", "options": ["To induce bleed-out on any bird the automatic knife didn't effectively cut", "To sharpen and maintain the automatic knife blade between shifts", "To operate the shackle line at the start of the process instead", "To record footpad health scores during the processing audit"], "correctIndex": 0, "explanation": " The backup knife operator catches what the automatic knife misses \u2014 inducing bleed-out on any bird it didn't effectively cut."}, {"type": "multi", "question": "\ud83d\udd0d Animal Welfare Officer Check: Which of these are real audit requirements at the plant? Select all that apply.", "options": ["A documented monitoring program for wing and leg injuries", "A backup knife operator after the automatic knife", "A written emergency plan for equipment failure", "A monthly bake sale for the break room"], "correctIndices": [0, 1, 2], "explanation": " All three real requirements \u2014 documented injury monitoring, a backup knife operator, and a written emergency plan \u2014 are genuine audit items. The bake sale, while lovely, isn't a welfare requirement."}, {"type": "single", "question": "\ud83d\udd0d Animal Welfare Officer Check: Look at this reference photo. Does it show a PASS or FAIL wing posture?", "options": ["PASS \u2014 normal wing posture, no dislocation or breaks", "FAIL \u2014 broken or dislocated wing", "Neither \u2014 wing posture photos like this aren't actually used in welfare audits", "It depends on the bird's age, which changes what counts as normal posture"], "correctIndex": 0, "explanation": " This shows normal, relaxed wing posture with no dislocation or breaks \u2014 a clear PASS under the AAAP wing condition scoring criteria.", "image": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUDBAQEAwUEBAQFBQUGBwwIBwcHBw8LCwkMEQ8SEhEPERETFhwXExQaFRERGCEYGh0dHx8fExciJCIeJBweHx7/2wBDAQUFBQcGBw4ICA4eFBEUHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh7/wAARCAHjAegDASIAAhEBAxEB/8QAHQABAAIDAQEBAQAAAAAAAAAAAAUGBAcIAwIJAf/EAFUQAAIBAwIDBgIFCQYEAgYIBwECAwAEEQUhBhIxBxMiQVFhFHEIIzJCgRUYVZGUobHR1CQzUsHh8BZicvE0gkNEU5Ky0yVjdISio8LSNVRkc4OztP/EABoBAQADAQEBAAAAAAAAAAAAAAADBAUCAQb/xAAyEQACAgEEAQMCBAYCAwEAAAAAAQIDEQQSITFBBRMiUWEUcZHwIzKBobHBBtEVQuFS/9oADAMBAAIRAxEAPwDjKlKUApSlAKUpQClKUApSlAKUpQClKUApSlAKUpQClKUAr0tgTcRBRklxj9dedelscXERLcuHG/pvQI2hoGmyXXDtqFRjLliyhgMDmb/StidkjHSb6KSbwQLNIzM25GY8eX4VQey/U1e6NpcAC3S3dlmd/Ax5xsM7Z3Pn5Gt42WiQHhm6mhijSRZQF5IRzfd9Kyb3iTRo19Jm/ezGRLiWOZDlJLIOpxjIPIat+qW4lgaHfxAdD71Q+yGYRw2kOxdNNRSM77cg6VseblMZIwT617THNbTObJYsTRR9esbeOa1kV5CYmJfJG2Me1StlfQjRkCOCd8eE/wCKo7iYO91Gg5kBdwT67isJu/hte6RJGQdGAOOtUd2ybwXVFzhHJsbSpV+DiZjjmjU9Pas1SGGQcioDQLgXNlBGGCmKNA/iz5efp0rNe4kS6eBEdlUZDA7Hp/Otmq34J+DKnW9zRCa8pZSsfiJUfxrHsLeRoFXl8QzkZHrUlcw89wqv9WpXdyNh1r4tu7S9eBJFflXOQfl/Os9QlGzd4LjlF17T // ---------- utilities ----------
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function shuffleOptions(q){
  const idx = shuffle(q.options.map((_,i)=>i));
  const newOptions = idx.map(i=>q.options[i]);
  if(q.type === 'multi'){
    const newCorrect = q.correctIndices.map(oldI => idx.indexOf(oldI));
    return { type:'multi', question:q.question, options:newOptions, correctIndices:newCorrect, explanation:q.explanation || '', image:q.image };
  }
  return { type:'single', question:q.question, options:newOptions, correctIndex: idx.indexOf(q.correctIndex), explanation:q.explanation || '', image:q.image };
}
function article(n){ return [8,11,18].includes(n) ? 'an' : 'a'; }
function prepareBank(bank, sampleSize){
  // Draws `sampleSize` questions at random from the pool (independently for pre/post),
  // so a pool larger than the sample size yields genuinely different pre- vs post-assessments,
  // not just a reshuffled copy of the same questions.
  const n = sampleSize || bank.length;
  const order = shuffle(bank.map((_,i)=>i)).slice(0, Math.min(n, bank.length));
  return order.map(i => shuffleOptions(bank[i]));
}

  const track = el('div','progress-track');
  const fill = el('div','progress-fill'); fill.style.width = pct+'%';
  track.appendChild(fill);
  trackWrap.appendChild(track);
  trackWrap.appendChild(el('div','progress-label sans', 'Step ' + (current+1) + ' of ' + total));
  container.appendChild(trackWrap);
}

function goTo(idx){
  current = Math.max(0, Math.min(SLIDES.length-1, idx));
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  renderHeader(app);
  const card = el('div','card');
  const slide = SLIDES[current];
  if(slide.type === 'landing') renderLanding(card);
  else if(slide.type === 'pretestIntro') renderAssessIntro(card, 'pretest');
  else if(slide.type === 'pretest') renderAssessQuestion(card, 'pretest', slide.qIndex);
  else if(slide.type === 'pretestResult') renderPretestResult(card);
  else if(slide.type === 'content') renderContent(card, slide.moduleIndex);
  else if(slide.type === 'kc') renderKC(card, slide.moduleIndex, slide.kcIndex);
  else if(slide.type === 'posttestIntro') renderAssessIntro(card, 'posttest');
  else if(slide.type === 'posttest') renderAssessQuestion(card, 'posttest', slide.qIndex);
  else if(slide.type === 'summary') renderSummary(card);
  else if(slide.type === 'survey') renderSurvey(card);
  app.appendChild(card);
}

  const next = el('button','btn btn-primary sans', nextLabel);
  if(nextDisabled) next.disabled = true;
  next.addEventListener('click', onNext);
  wrap.appendChild(next);

// ---------- SOUND EFFECTS (synthesized, no audio files / network needed) ----------
let soundEnabled = true;
let audioCtx = null;
function getAudioCtx(){
  if(audioCtx) return audioCtx;
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
  catch(e){ audioCtx = null; }
  return audioCtx;
}
function playTone(freq, startTime, duration, type, peakGain){
  if(!soundEnabled) return;
  const ctx = getAudioCtx();
  if(!ctx) return;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  const t0 = ctx.currentTime + startTime;
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(peakGain, t0 + 0.015);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(t0);
  osc.stop(t0 + duration + 0.03);
}
function playCorrectSound(){
  // cheerful two-note ascending chime (Duolingo-style "ding")
  playTone(783.99, 0,    0.14, 'sine', 0.18); // G5
  playTone(1046.50, 0.09, 0.22, 'sine', 0.18); // C6
}
function playIncorrectSound(){
  // short low "buzz" — two quick descending notes
  playTone(196.00, 0,    0.14, 'square', 0.06); // G3
  playTone(146.83, 0.09, 0.20, 'square', 0.06); // D3
}
function playLevelUpSound(){
  // little three-note fanfare
  playTone(659.25, 0,    0.12, 'sine', 0.16);
  playTone(830.61, 0.10, 0.12, 'sine', 0.16);
  playTone(1046.50, 0.20, 0.28, 'sine', 0.18);
}

let kcStreak = 0;
let totalXP = 0;
let lastXPEarned = 0;      // XP earned on the most recent correct answer (for the "+XP" pop)
let justLeveledUp = false; // set true for one render when a level threshold is crossed

const LEVELS = [
  { min: 0,   title: 'AWO Trainee',   emoji: '\u{1F331}', color: 'var(--slate)' },
  { min: 125, title: 'Junior AWO',    emoji: '\u2B50',     color: 'var(--amber)' },
  { min: 250, title: 'Senior AWO',    emoji: '\u{1F3C5}',  color: 'var(--maroon)' },
  { min: 375, title: 'Lead Auditor',  emoji: '\u{1F396}\uFE0F', color: 'var(--maroon-dk)' }
];
function getLevel(xp){
  let idx = 0;
  for(let i=0;i<LEVELS.length;i++){ if(xp >= LEVELS[i].min) idx = i; }
  return idx;
}
const MAX_WESHINE_POINTS = 500;
function awardXP(isMulti, hasImage){
  const base = isMulti ? 20 : 10;
  const imageBonus = hasImage ? 5 : 0;
  const comboBonus = Math.min(kcStreak * 2, 20); // kcStreak already incremented before this is called
  const rawEarned = base + imageBonus + comboBonus;
  const levelBefore = getLevel(totalXP);
  const earned = Math.max(0, Math.min(rawEarned, MAX_WESHINE_POINTS - totalXP));
  totalXP = Math.min(totalXP + rawEarned, MAX_WESHINE_POINTS);
  const levelAfter = getLevel(totalXP);
  lastXPEarned = earned;
  justLeveledUp = levelAfter > levelBefore;
  return earned;
}

function arraysMatch(a, b){
  const as = [...a].sort().join(',');
  const bs = [...b].sort().join(',');
  return as === bs;
}

function renderKC(card, mi, ki){
  const m = COURSE.modules[mi];
  const kc = m.kcs[ki];
  const isMulti = kc.type === 'multi';
  const key = mi+'-'+ki;
  if(!kcState[key]) kcState[key] = {selected: isMulti ? [] : null, submitted:false, correctFirstTry:null};
  const st = kcState[key];

  const totalKC = totalKCCount();
  const kcNumber = COURSE.modules.slice(0,mi).reduce((n,mm)=>n+mm.kcs.length,0) + ki + 1;

  const levelIdx = getLevel(totalXP);
  const lvl = LEVELS[levelIdx];
  const nextLvl = LEVELS[levelIdx+1];
  const xpWrap = el('div');
  xpWrap.style.cssText = 'margin-bottom:16px;';
  const xpHeader = el('div','sans');
  xpHeader.style.cssText = 'display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:800;margin-bottom:5px;';
  const leftSpan = document.createElement('span');
  leftSpan.style.color = lvl.color;
  leftSpan.innerHTML = lvl.emoji + ' ' + lvl.title + (kcStreak >= 2 ? '&nbsp;&nbsp;<span style="color:var(--amber)">\u{1F525} ' + kcStreak + '</span>' : '');
  const rightSpan = document.createElement('span');
  rightSpan.style.color = 'var(--slate)';
  rightSpan.textContent = '\u{1F31F} ' + totalXP + ' WeShine pts' + (nextLvl ? '  (' + (nextLvl.min - totalXP) + ' to ' + nextLvl.title + ')' : '  (Max level!)');
  xpHeader.appendChild(leftSpan);
  xpHeader.appendChild(rightSpan);
  xpWrap.appendChild(xpHeader);
  const track = el('div'); track.style.cssText = 'height:9px;background:var(--cream2);border-radius:5px;overflow:hidden;';
  const pct = nextLvl ? Math.max(2, Math.min(100, Math.round((totalXP - lvl.min) / (nextLvl.min - lvl.min) * 100))) : 100;
  const fill = el('div'); fill.style.cssText = 'height:100%;width:' + pct + '%;background:linear-gradient(90deg,var(--gold),var(--maroon));border-radius:5px;transition:width .5s ease;';
  track.appendChild(fill);
  xpWrap.appendChild(track);
  card.appendChild(xpWrap);

  const badgeWrap = el('div','kc-badge sans', '\u2713 KNOWLEDGE CHECK ' + kcNumber + ' OF ' + totalKC + (isMulti ? '  \u2022  SELECT ALL THAT APPLY' : ''));
  card.appendChild(badgeWrap);
  if(kc.image){
    const img = document.createElement('img');
    img.className = 'kc-photo';
    img.src = kc.image;
    img.alt = 'Reference photo';
    card.appendChild(img);
  }
  card.appendChild(el('div','kc-question', kc.question));

  const optWrap = el('div','options');
  const correctSet = isMulti ? kc.correctIndices : [kc.correctIndex];
  kc.options.forEach((opt, oi) => {
    const btn = el('button','option sans');
    btn.type = 'button';
    const letter = el('span','letter', isMulti ? '\u2713' : String.fromCharCode(65+oi));
    if(isMulti) letter.style.opacity = (st.selected.includes(oi) || st.submitted) ? '1' : '0';
    if(isMulti) letter.style.borderRadius = '5px';
    btn.appendChild(letter);
    btn.appendChild(el('span', null, opt));
    const isSelected = isMulti ? st.selected.includes(oi) : st.selected === oi;
    if(st.submitted){
      btn.disabled = true;
      btn.classList.add('locked');
      if(correctSet.includes(oi)) btn.classList.add('correct');
      else if(isSelected) btn.classList.add('incorrect');
    } else {
      if(isSelected) btn.classList.add('selected');
      btn.addEventListener('click', ()=>{
        if(isMulti){
          const idx = st.selected.indexOf(oi);
          if(idx === -1) st.selected.push(oi); else st.selected.splice(idx,1);
        } else {
          st.selected = oi;
        }
        render();
      });
    }
    optWrap.appendChild(btn);
  });
  card.appendChild(optWrap);

  const fb = el('div','feedback');
  if(st.submitted){
    const isCorrect = isMulti ? arraysMatch(st.selected, correctSet) : st.selected === kc.correctIndex;
    fb.classList.add('show', isCorrect ? 'correct-fb' : 'incorrect-fb');
    let html = '<b>'+(isCorrect ? 'Correct.' : 'Not quite.')+'</b>' + kc.explanation;
    if(isCorrect && st.xpAwarded){
      html += '<div class="xp-pop">\u{1F31F} +' + st.xpAwarded + ' WeShine pts' + (st.comboAtAward >= 2 ? '  \u{1F525} Combo bonus!' : '') + '</div>';
    }
    fb.innerHTML = html;
  }
  card.appendChild(fb);
  if(st.submitted){
    const isCorrect = isMulti ? arraysMatch(st.selected, correctSet) : st.selected === kc.correctIndex;
    if(isCorrect && st.showedLevelUp){
      const lvlBanner = el('div','level-up-banner sans');
      lvlBanner.innerHTML = '\u{1F389} <b>LEVEL UP!</b> You\'re now a ' + st.leveledUpTitle;
      card.insertBefore(lvlBanner, fb);
    }
  }

  const footWrap = el('div','card-footer');
  const back = el('button','btn btn-ghost sans','\u2190 Back');
  back.addEventListener('click', ()=>goTo(current-1));
  footWrap.appendChild(back);

  const hasSelection = isMulti ? st.selected.length > 0 : st.selected !== null;
  if(!st.submitted){
    const submit = el('button','btn btn-primary sans','Submit Answer');
    submit.disabled = !hasSelection;
    submit.addEventListener('click', ()=>{
      st.submitted = true;
      const isCorrect = isMulti ? arraysMatch(st.selected, correctSet) : st.selected === kc.correctIndex;
      if(isCorrect) playCorrectSound(); else playIncorrectSound();
      if(st.correctFirstTry === null){
        st.correctFirstTry = isCorrect;
        kcStreak = isCorrect ? kcStreak + 1 : 0;
        if(isCorrect){
          st.comboAtAward = kcStreak;
          st.xpAwarded = awardXP(isMulti, !!kc.image);
          st.showedLevelUp = justLeveledUp;
          st.leveledUpTitle = justLeveledUp ? LEVELS[getLevel(totalXP)].emoji + ' ' + LEVELS[getLevel(totalXP)].title : '';
          if(justLeveledUp) setTimeout(playLevelUpSound, 350);
        }
      }
      render();
    });
    footWrap.appendChild(submit);
  } else if(!(isMulti ? arraysMatch(st.selected, correctSet) : st.selected === kc.correctIndex)){
    const retry = el('button','btn btn-primary sans','Try Again');
    retry.addEventListener('click', ()=>{ st.submitted=false; st.selected = isMulti ? [] : null; render(); });
    footWrap.appendChild(retry);
  } else {
    const cont = el('button','btn btn-primary sans','Continue \u2192');
    cont.addEventListener('click', ()=>goTo(current+1));
    footWrap.appendChild(cont);
  }
  card.appendChild(footWrap);
}

// ---------- SUMMARY ----------
function renderSummary(card){
  const preScore = pretestAnswers.reduce((n,a,i)=> n + (a === PRE_BANK[i].correctIndex ? 1 : 0), 0);
  const postScore = posttestAnswers.reduce((n,a,i)=> n + (a === POST_BANK[i].correctIndex ? 1 : 0), 0);
  const totalKC = totalKCCount();
  let kcCorrect = 0;
  Object.values(kcState).forEach(s => { if(s.correctFirstTry) kcCorrect++; });
  const delta = postScore - preScore;

  card.appendChild(el('div','complete-icon', '\u2713'));
  card.appendChild(el('div','kicker', COURSE.courseCode + ' COMPLETE'));
  card.appendChild(el('h1','slide-title', 'Nice work.'));
  const body = el('div','body-text');
  body.appendChild(el('p', null, "You've completed " + COURSE.courseTitle + ' — pre-assessment, all modules and knowledge checks, and the post-assessment.'));
  card.appendChild(body);

  const scoreBox = el('div','score-box');
  const items = [
    [preScore, PRE_BANK.length, 'Pre-assessment', false],
    [postScore, POST_BANK.length, 'Post-assessment', delta > 0],
    [kcCorrect, totalKC, 'Knowledge checks (first try)', false]
  ];
  items.forEach(([num,total,label,forceGreen])=>{
    const s = el('div');
    const numEl = el('div','score-num', num + '/' + total);
    if((num/total) >= 0.8 || forceGreen){ numEl.style.color = 'var(--green)'; }
    s.appendChild(numEl);
    s.appendChild(el('div','score-label sans', label));
    scoreBox.appendChild(s);
  });
  card.appendChild(scoreBox);

  const finalLevelIdx = getLevel(totalXP);
  const finalLvl = LEVELS[finalLevelIdx];
  const xpSummary = el('div');
  xpSummary.style.cssText = 'background:var(--cream); border-radius:8px; padding:16px 20px; margin:4px 0 20px; text-align:center;';
  xpSummary.innerHTML = '<div style="font-family:Georgia,serif;font-size:30px;color:var(--maroon);font-weight:bold;">\u{1F31F} ' + totalXP + ' WeShine points earned</div>' +
    '<div class="sans" style="font-size:13.5px;color:var(--slate);margin-top:4px;">Final rank: ' + finalLvl.emoji + ' <b>' + finalLvl.title + '</b></div>';
  card.appendChild(xpSummary);

  if(kcCorrect === totalKC && totalKC > 0){
    const badge = el('div','callout', '\u{1F3C6} <b>Perfect Welfare Score!</b> You got every knowledge check right on the first try.');
    badge.style.borderLeftColor = 'var(--green)';
    badge.style.color = '#20573B';
    card.appendChild(badge);
  }

  let deltaMsg;
  if(delta > 0) deltaMsg = 'Congratulations! You improved by ' + delta + ' question' + (delta===1?'':'s') + ' from pre- to post-assessment.';
  else if(delta === 0) deltaMsg = 'You matched your pre-assessment score — solid baseline retention.';
  else deltaMsg = "Your post-assessment score came in lower than your pre-assessment. Worth a second pass through this course before moving on.";
  card.appendChild(el('div','callout', deltaMsg));

  if(COURSE.leadsTo){
    const next = el('div','body-text');
    next.style.marginTop = '18px';
    next.appendChild(el('p', null, '<b>Next up:</b> ' + COURSE.leadsTo));
    card.appendChild(next);
  }

  const footWrap = el('div','card-footer');
  const back = el('button','btn btn-ghost sans','\u2190 Review');
  back.addEventListener('click', ()=>goTo(current-1));
  footWrap.appendChild(back);
  const toSurvey = el('button','btn btn-primary sans','Continue to Feedback Survey \u2192');
  toSurvey.addEventListener('click', ()=>goTo(current+1));
  footWrap.appendChild(toSurvey);
  card.appendChild(footWrap);
}

  const table = document.createElement('table');
  table.className = 'survey-meta';
  const rows = [
    ['Course / Session Completed', COURSE.courseCode + ' — ' + COURSE.courseTitle],
    ['College', COURSE.college],
    ['Employee Type', COURSE.employeeType],
    ['Date', new Date().toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' })]
  ];
  rows.forEach(([label,val])=>{
    const tr = document.createElement('tr');
    const td1 = document.createElement('td'); td1.className='label'; td1.textContent = label;
    const td2 = document.createElement('td'); td2.className='value'; td2.textContent = val;
    tr.appendChild(td1); tr.appendChild(td2);
    table.appendChild(tr);
  });
  card.appendChild(table);

  card.appendChild(ratingRow('1. Overall, how would you rate this training?', 'overall', 'Poor', 'Excellent'));
  card.appendChild(ratingRow('2. The training content was clear and easy to understand.', 'clear', 'Strongly Disagree', 'Strongly Agree'));
  card.appendChild(ratingRow('3. I feel confident applying what I learned to my job.', 'confident', 'Strongly Disagree', 'Strongly Agree'));
  card.appendChild(ratingRow('4. This training was a good use of my time.', 'goodUse', 'Strongly Disagree', 'Strongly Agree'));

  const q5 = el('div','survey-q');
  q5.appendChild(el('div','survey-q-text', '5. What suggestions do you have to improve this course?'));
  const textarea = document.createElement('textarea');
  textarea.className = 'survey-textarea';
  textarea.placeholder = 'Optional — share any thoughts here.';
  textarea.value = surveyState.suggestions;
  textarea.addEventListener('input', (e)=>{ surveyState.suggestions = e.target.value; });
  q5.appendChild(textarea);
  card.appendChild(q5);

  const allRated = surveyState.overall && surveyState.clear && surveyState.confident && surveyState.goodUse;
  const footWrap = el('div','card-footer');
  const back = el('button','btn btn-ghost sans','\u2190 Back');
  back.addEventListener('click', ()=>goTo(current-1));
  footWrap.appendChild(back);
  const submit = el('button','btn btn-primary sans','Submit Feedback');
  submit.disabled = !allRated;
  submit.addEventListener('click', ()=>{ surveyState.submitted = true; render(); });
  footWrap.appendChild(submit);
  card.appendChild(footWrap);
}

render();
</script>
</body>
</html>
